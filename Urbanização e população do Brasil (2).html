<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urbanização e população do Brasil</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d2420;--mu:#5d6862;--bd:#dcdad2;--a:#2f7d5b;--b:#c9742b;--c:#3b6ea5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--card:#1d231f;--tx:#e8ece9;--mu:#9aa6a0;--bd:#2f3832;--a:#4fb88a;--b:#e59a56;--c:#6fa3d8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}p.s{color:var(--mu);margin:0 0 12px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:1rem;cursor:pointer}
.tabs button.on{background:var(--a);color:#fff;border-color:var(--a)}
.ctl{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.ctl input{width:100%}.ctl b{font-size:1.2rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card.w{grid-column:1/-1}.card h2{font-size:1rem;margin:0 0 8px}
.box{position:relative;height:300px}
.note{color:var(--mu);font-size:.85rem;margin-top:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.card.w{grid-column:auto}}
</style></head><body><main>
<h1>Urbanização e população do Brasil</h1>
<p class="s">Arraste o controle para ver a evolução do começo até 2026.</p>
<div class="tabs"><button id="t1" class="on">Urbanização (1940–2026)</button><button id="t2">População (2000–2026)</button></div>
<div class="ctl"><label>Ver até o ano: <b id="yr"></b></label><input type="range" id="sl"></div>
<div class="grid">
<div class="card w"><h2 id="h1"></h2><div class="box"><canvas id="c1"></canvas></div></div>
<div class="card"><h2 id="h2"></h2><div class="box"><canvas id="c2"></canvas></div></div>
<div class="card"><h2 id="h3"></h2><div class="box"><canvas id="c3"></canvas></div></div>
</div>
<p class="note" id="nt"></p>
</main>
<script>
const U={y:[1940,1950,1960,1970,1980,1991,2000,2010,2022,2026],u:[12.8,18.8,32.0,52.1,80.4,110.9,137.9,160.9,177.5,183.4],r:[28.4,33.2,38.0,41.0,38.6,36.0,31.9,29.8,25.6,23.6]};
U.p=U.y.map((_,i)=>+(U.u[i]/(U.u[i]+U.r[i])*100).toFixed(1));
const A=[[2000,169.8],[2010,190.8],[2022,203.1],[2026,207.0]];
const P={y:[],v:[]};
for(let y=2000;y<=2026;y++){let k=A.findIndex((a,i)=>i<A.length-1&&y<=A[i+1][0]);const[a,b]=[A[k],A[k+1]];P.y.push(y);P.v.push(+(a[1]+(b[1]-a[1])*(y-a[0])/(b[0]-a[0])).toFixed(1));}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let mode=1,ch=[];
const sl=document.getElementById('sl');
function draw(){
 ch.forEach(c=>c.destroy());ch=[];
 const tx=css('--tx'),mu=css('--mu'),bd=css('--bd'),a=css('--a'),b=css('--b'),c=css('--c');
 Chart.defaults.color=mu;Chart.defaults.borderColor=bd;Chart.defaults.maintainAspectRatio=false;
 const i=+sl.value;let L,s1,s2,pie,pl,h;
 const sc=(t)=>({y:{title:{display:true,text:t}}});
 if(mode==1){
  const n=i+1;L=U.y.slice(0,n);
  document.getElementById('yr').textContent=U.y[i]+(U.y[i]==2026?' (estimativa)':'');
  h=['Taxa de urbanização (% da população em cidades)','Urbana × rural (milhões de pessoas)',`Proporção em ${U.y[i]}`];
  ch.push(new Chart(c1,{type:'line',data:{labels:L,datasets:[{label:'% urbana',data:U.p.slice(0,n),borderColor:a,backgroundColor:a,tension:.3,fill:false},{label:'% rural',data:U.p.slice(0,n).map(v=>+(100-v).toFixed(1)),borderColor:b,backgroundColor:b,tension:.3}]},options:{scales:sc('%')}}));
  ch.push(new Chart(c2,{type:'bar',data:{labels:L,datasets:[{label:'Urbana',data:U.u.slice(0,n),backgroundColor:a},{label:'Rural',data:U.r.slice(0,n),backgroundColor:b}]},options:{scales:sc('milhões')}}));
  ch.push(new Chart(c3,{type:'pie',data:{labels:['Urbana','Rural'],datasets:[{data:[U.u[i],U.r[i]],backgroundColor:[a,b],borderColor:css('--card')}]},options:{plugins:{tooltip:{callbacks:{label:t=>`${t.label}: ${t.raw} mi (${(t.raw/(U.u[i]+U.r[i])*100).toFixed(1)}%)`}}}}}));
  document.getElementById('nt').textContent='Dados aproximados dos Censos do IBGE (1940–2022). O êxodo rural aparece na queda da população rural a partir de 1970. Valores de 2026 são estimativas. Antes de 1940 não há dados censitários comparáveis.';
 }else{
  const k=i;L=P.y.slice(0,k+1);const v=P.v.slice(0,k+1);
  document.getElementById('yr').textContent=P.y[k]+(P.y[k]>=2023?' (estimativa)':'');
  h=['População total (milhões)','Aumento anual (milhões)',`Crescimento acumulado por período até ${P.y[k]}`];
  ch.push(new Chart(c1,{type:'line',data:{labels:L,datasets:[{label:'População',data:v,borderColor:c,backgroundColor:c,tension:.3}]},options:{scales:sc('milhões')}}));
  ch.push(new Chart(c2,{type:'bar',data:{labels:L.slice(1),datasets:[{label:'Aumento no ano',data:v.slice(1).map((x,j)=>+(x-v[j]).toFixed(2)),backgroundColor:c}]},options:{scales:sc('milhões')}}));
  const cuts=[[2000,2005],[2005,2010],[2010,2015],[2015,2020],[2020,2026]].filter(x=>x[0]<P.y[k]);
  const d=cuts.map(([s,e])=>{const ee=Math.min(e,P.y[k]);return +(P.v[ee-2000]-P.v[s-2000]).toFixed(1)});
  const cols=[a,b,c,'#8a6bb0','#c4a73a'];
  ch.push(new Chart(c3,{type:'pie',data:{labels:cuts.map(x=>x[0]+'–'+Math.min(x[1],P.y[k])),datasets:[{data:d,backgroundColor:cols,borderColor:css('--card')}]},options:{plugins:{tooltip:{callbacks:{label:t=>`${t.label}: +${t.raw} mi`}}}}}));
  document.getElementById('nt').textContent='Valores aproximados (Censos 2000, 2010 e 2022 do IBGE, com interpolação entre eles; 2023–2026 são estimativas). O crescimento desacelera ao longo do período.';
 }
 ['h1','h2','h3'].forEach((id,j)=>document.getElementById(id).textContent=h[j]);
}
function setMode(m){mode=m;t1.classList.toggle('on',m==1);t2.classList.toggle('on',m==2);
 sl.min=0;sl.max=(m==1?U.y.length:P.y.length)-1;sl.value=sl.max;draw();}
t1.onclick=()=>setMode(1);t2.onclick=()=>setMode(2);sl.oninput=draw;
setMode(1);
</script></body></html>
